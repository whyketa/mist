<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MIST</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <script src="script.js" defer></script>
    <script src="visual.js" defer></script>

    <canvas id="pond" class="layer"></canvas>
    <canvas id="air" class="layer"></canvas>

    <div id="stage">
      <!-- ============ WATER ============ -->
      <section id="water" class="panel panel--side" data-voice="water">
        <h2>water</h2>

        <div class="pills">
          <button id="waterStart" class="pill pill--start" type="button">start water</button>
          <button id="waterStop" class="pill" type="button">stop water</button>
        </div>

        <div class="sliders">
          <div class="row">
            <label for="waterVolume">volume</label>
            <output data-for="waterVolume" data-fmt="db"></output>
            <input id="waterVolume" type="range" min="-30" max="0" value="-8" step="1" />
          </div>
          <div class="row">
            <label for="waterFilter">filter</label>
            <output data-for="waterFilter" data-fmt="hz"></output>
            <input id="waterFilter" type="range" min="200" max="3000" value="900" step="10" />
          </div>
          <div class="row">
            <label for="waterReverb">reverb</label>
            <output data-for="waterReverb" data-fmt="pct"></output>
            <input id="waterReverb" type="range" min="0" max="1" value="0.5" step="0.01" />
          </div>
          <div class="row">
            <label for="waterPan">pan</label>
            <output data-for="waterPan" data-fmt="pan"></output>
            <input id="waterPan" type="range" min="-1" max="1" value="-0.6" step="0.01" data-center />
          </div>
          <div class="row">
            <label for="waterDelay">delay</label>
            <output data-for="waterDelay" data-fmt="pct"></output>
            <input id="waterDelay" type="range" min="0" max="1" value="0.2" step="0.01" />
          </div>
        </div>

        <div class="presets" role="group" aria-label="Water pattern">
          <button id="waterCalm" class="chip is-active" type="button">calm</button>
          <button id="waterFlow" class="chip" type="button">flow</button>
          <button id="waterRain" class="chip" type="button">rain</button>
          <button id="waterRandom" class="chip" type="button">random</button>
        </div>
      </section>

      <!-- ============ MIST ============ -->
      <section id="mist" class="panel panel--mist" data-voice="mist">
        <h2>mist</h2>

        <div class="pills">
          <button id="mistStart" class="pill pill--start" type="button">start mist</button>
          <button id="mistStop" class="pill" type="button">stop mist</button>
        </div>

        <div class="sliders">
          <div class="row row--big">
            <label for="mistVolume">volume</label>
            <output data-for="mistVolume" data-fmt="db"></output>
            <input id="mistVolume" type="range" min="-40" max="-5" value="-24" step="1" />
          </div>
          <div class="row row--big">
            <label for="mistFilter">filter</label>
            <output data-for="mistFilter" data-fmt="hz"></output>
            <input id="mistFilter" type="range" min="200" max="3000" value="700" step="10" />
          </div>
        </div>
      </section>

      <!-- ============ TEMPO ============ -->
      <section id="tempo" class="panel panel--tempo" data-voice="tempo">
        <div class="row row--big">
          <label for="tempoControl">tempo</label>
          <output><span id="tempoValue">52</span> bpm</output>
          <input id="tempoControl" type="range" min="40" max="100" value="52" step="1" />
        </div>
      </section>

      <!-- ============ BELL ============ -->
      <section id="bell" class="panel panel--side" data-voice="bell">
        <h2>bell</h2>

        <div class="pills">
          <button id="bellStart" class="pill pill--start" type="button">start bell</button>
          <button id="bellStop" class="pill" type="button">stop bell</button>
        </div>

        <div class="sliders">
          <div class="row">
            <label for="bellVolume">volume</label>
            <output data-for="bellVolume" data-fmt="db"></output>
            <input id="bellVolume" type="range" min="-30" max="0" value="-8" step="1" />
          </div>
          <div class="row">
            <label for="bellFilter">filter</label>
            <output data-for="bellFilter" data-fmt="hz"></output>
            <input id="bellFilter" type="range" min="200" max="5000" value="1500" step="10" />
          </div>
          <div class="row">
            <label for="bellReverb">reverb</label>
            <output data-for="bellReverb" data-fmt="pct"></output>
            <input id="bellReverb" type="range" min="0" max="1" value="0.7" step="0.01" />
          </div>
          <div class="row">
            <label for="bellPan">pan</label>
            <output data-for="bellPan" data-fmt="pan"></output>
            <input id="bellPan" type="range" min="-1" max="1" value="0.6" step="0.01" data-center />
          </div>
          <div class="row">
            <label for="bellChorus">chorus</label>
            <output data-for="bellChorus" data-fmt="pct"></output>
            <input id="bellChorus" type="range" min="0" max="1" value="0.3" step="0.01" />
          </div>
        </div>

        <div class="presets" role="group" aria-label="Bell pattern">
          <button id="bellTemple" class="chip" type="button">temple</button>
          <button id="bellZen" class="chip is-active" type="button">zen</button>
          <button id="bellNight" class="chip" type="button">night</button>
          <button id="bellRandom" class="chip" type="button">random</button>
        </div>
      </section>
    </div>

    <canvas id="fog" class="layer"></canvas>
  
</body></html>
