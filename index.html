<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mist</title>
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <script src="script.js" defer></script>
    <script src="steam.js" defer></script>
    <script src="remote.js" defer></script>
  </head>

  <body>
    <div id="room">
      <img class="plate" id="plate-full" src="img/room.jpg" alt="" />
      <img class="plate" id="plate-empty" src="img/room-empty.jpg" alt="" />

      <div id="lidtint"></div>

      <div id="light">
        <img src="img/light.jpg" alt="" />
        <div class="tint"></div>
      </div>

      <div id="night"></div>

      <i class="led" style="left: 853px; --c: 90, 155, 255"></i>
      <i class="led" style="left: 899px; --c: 80, 230, 130"></i>
      <i class="led" style="left: 946px; --c: 255, 140, 60"></i>
      <i class="led" style="left: 994px; --c: 70, 240, 110"></i>

      <canvas id="steam"></canvas>

      <button id="pickup" aria-label="remote"></button>
      <div id="backdrop"></div>

      <div id="remote">
        <img class="rc rc--closed" src="img/remote-closed.png" alt="" />
        <img class="rc rc--open" src="img/remote-open.png" alt="" />

        <button class="key" data-voice="water" data-act="up" style="--x: 33.4%; --y: 12.9%"></button>
        <button class="key" data-voice="water" data-act="down" style="--x: 39.1%; --y: 20.4%"></button>
        <button class="key" data-voice="bell" data-act="up" style="--x: 67.2%; --y: 12.9%"></button>
        <button class="key" data-voice="bell" data-act="down" style="--x: 61.4%; --y: 20.4%"></button>
        <button class="key" data-voice="mist" data-act="down" style="--x: 50%; --y: 27.5%"></button>
        <button class="key" data-voice="mist" data-act="up" style="--x: 50%; --y: 35.6%"></button>

        <button class="key key--big" data-fn="sun" style="--x: 24.8%; --y: 46.5%"></button>
        <button class="key key--big" data-fn="tempo" style="--x: 50%; --y: 46.5%"></button>
        <button class="key key--big" data-fn="moon" style="--x: 75.3%; --y: 46.5%"></button>

        <button id="cover" aria-label="cover"></button>

        <div id="panel">
          <div id="lcd"><i></i><span>--</span></div>
          <div class="slider" data-param="filter" style="--x: 26.3%"><b></b></div>
          <div class="slider" data-param="reverb" style="--x: 41.7%"><b></b></div>
          <div class="slider" data-param="pan" style="--x: 57.1%"><b></b></div>
          <div class="slider" data-param="echo" style="--x: 72.6%"><b></b></div>
        </div>
      </div>
    </div>
  </body>
</html>
