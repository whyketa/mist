<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>mist</title>
    <link rel="stylesheet" href="style.css" />

    <script src="https://unpkg.com/tone@15.1.22/build/Tone.js"></script>
    <script src="script.js" defer></script>
    <script src="steam.js" defer></script>
    <script src="remote.js" defer></script>
  </head>

  <body>
    <div id="room">
      <img class="plate" id="plate-full" src="img/room.jpg" alt="" />
      <img class="plate" id="plate-empty" src="img/room-empty.jpg" alt="" />

      <div id="lidtint"></div>

      <div id="light">
        <img src="img/light.jpg" alt="" />
        <div class="tint"></div>
      </div>

      <!-- the printed panel on the device, redrawn as vector so it stays sharp -->
      <svg id="print" viewBox="0 0 1536 1024" aria-hidden="true">
        <g fill="rgb(112, 111, 128)">
          <circle cx="853.3" cy="626" r="5" />
          <circle cx="899" cy="626" r="5" />
          <circle cx="945.9" cy="626" r="5" />
          <circle cx="994" cy="626" r="5" />
        </g>
        <g fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="0.7">
          <path d="M849.6 629.4a5 5 0 0 0 7.4 0M895.3 629.4a5 5 0 0 0 7.4 0M942.2 629.4a5 5 0 0 0 7.4 0M990.3 629.4a5 5 0 0 0 7.4 0" />
        </g>
        <g fill="none" stroke="rgb(98, 97, 114)" stroke-width="0.9" stroke-linecap="round">
          <path d="M853.3 633v8M994 633v8M899 633v7.5h46.9V633M922.5 640.5v4.5" />
        </g>
        <g fill="rgb(82, 81, 98)" font-family="Arial, Helvetica, sans-serif">
          <g font-size="14.5">
            <text x="846" y="615.6" textLength="16" lengthAdjust="spacingAndGlyphs">60</text>
            <text x="889" y="615.6" textLength="22" lengthAdjust="spacingAndGlyphs">120</text>
            <text x="936" y="615.6" textLength="22" lengthAdjust="spacingAndGlyphs">INT</text>
            <text x="984" y="615.6" textLength="20" lengthAdjust="spacingAndGlyphs">ON</text>
          </g>
          <g font-size="15.5">
            <text x="832" y="657.4" textLength="38" lengthAdjust="spacingAndGlyphs">LIGHT</text>
            <text x="909" y="657.4" textLength="28" lengthAdjust="spacingAndGlyphs">MIST</text>
            <text x="975" y="657.4" textLength="40" lengthAdjust="spacingAndGlyphs">TIMER</text>
          </g>
        </g>
      </svg>

      <div id="night"></div>

      <i class="led" style="left: 853px; --c: 90, 155, 255"></i>
      <i class="led" style="left: 899px; --c: 80, 230, 130"></i>
      <i class="led" style="left: 946px; --c: 255, 140, 60"></i>
      <i class="led" style="left: 994px; --c: 70, 240, 110"></i>

      <canvas id="steam"></canvas>

      <button id="pickup" aria-label="remote"></button>
      <div id="backdrop"></div>

      <div id="remote">
        <img class="rc rc--closed" src="img/remote-closed.png" alt="" />
        <img class="rc rc--open" src="img/remote-open.png" alt="" />

        <button class="key" data-voice="water" data-act="up" style="--x: 33.4%; --y: 12.9%"></button>
        <button class="key" data-voice="water" data-act="down" style="--x: 39.1%; --y: 20.4%"></button>
        <button class="key" data-voice="bell" data-act="up" style="--x: 67.2%; --y: 12.9%"></button>
        <button class="key" data-voice="bell" data-act="down" style="--x: 61.4%; --y: 20.4%"></button>
        <button class="key" data-voice="mist" data-act="down" style="--x: 50%; --y: 27.5%"></button>
        <button class="key" data-voice="mist" data-act="up" style="--x: 50%; --y: 35.6%"></button>

        <button class="key key--big" data-fn="sun" style="--x: 24.8%; --y: 46.5%"></button>
        <button class="key key--big" data-fn="tempo" style="--x: 50%; --y: 46.5%"></button>
        <button class="key key--big" data-fn="moon" style="--x: 75.3%; --y: 46.5%"></button>

        <button id="cover" aria-label="cover"></button>

        <div id="panel">
          <div id="lcd"><i></i><span>--</span></div>
          <div class="slider" data-param="filter" style="--x: 26.3%"><b></b></div>
          <div class="slider" data-param="reverb" style="--x: 41.7%"><b></b></div>
          <div class="slider" data-param="pan" style="--x: 57.1%"><b></b></div>
          <div class="slider" data-param="echo" style="--x: 72.6%"><b></b></div>
        </div>
      </div>
    </div>
  </body>
</html>
